<!DOCTYPE html>
<html>
<header>
<script src='/resources/testharness.js'></script>
<script src='/resources/testharnessreport.js'></script>
</header>
<body>
<script>
test(t => {
  const data = new AudioData({
    format: 'f32-planar',
    sampleRate: 48000,
    numberOfChannels: 1,
    numberOfFrames: 5,
    data: new Float32Array([1, 2, 3, 4, 5]),
    timestamp: 0,
  });
  const output = new Float32Array(data.numberOfFrames);
  data.copyTo(output.subarray(1, 4), {
    planeIndex: 0,
    frameOffset: 1,
    frameCount: 3,
  });
  data.close();
  assert_array_equals(output, [0, 2, 3, 4, 0], 'only 3 middle elements are copied');
}, 'Test that memcpy branch of AudioData.copyTo only copies frameCount amount of mono frames from frameOffset');
</script>
</body>
</html>
